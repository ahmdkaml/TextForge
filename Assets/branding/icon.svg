<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Standalone Foundry T Mark (Transparent Background) -->
  <g transform="translate(40, 36)">
    <!-- Base Layer: Foundation Slab / Stem -->
    <rect x="180" y="180" width="76" height="240" rx="8" fill="#0F172A"/>

    <!-- Document Block Layer 1 (Left Wing) -->
    <polygon points="80,100 236,100 206,164 80,164" fill="#2563EB"/>
    
    <!-- Document Block Layer 2 (Right Wing) -->
    <polygon points="226,100 352,100 352,164 246,164" fill="#0284C7"/>
    
    <!-- The "Forge" Spark / Prism Cut (Center Accent) -->
    <polygon points="206,100 260,100 230,164 176,164" fill="#F97316"/>
    
    <!-- Active Cursor Flow Accent -->
    <rect x="204" y="210" width="24" height="110" rx="6" fill="#F97316"/>
  </g>
</svg>
