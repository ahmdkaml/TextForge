    <!-- Base Stem -->
    <rect x="100" y="145" width="76" height="205" rx="8" fill="#0F172A"/>

    <!-- Document Block Layer 1 (Left Wing) -->
    <polygon points="0,80 156,80 126,144 0,144" fill="#2563EB"/>
    
    <!-- Document Block Layer 2 (Right Wing) -->
